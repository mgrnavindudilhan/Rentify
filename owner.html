<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rentify LK - Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 sm:p-8">

  <div class="max-w-4xl mx-auto">
    <div class="flex items-center justify-between mb-8 pb-4 border-b border-slate-800">
      <div>
        <h1 class="text-2xl font-black text-white">👑 Owner Control Center</h1>
        <p class="text-xs text-slate-400">List and manage your tools seamlessly.</p>
      </div>
      <a href="index.html" class="text-xs bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-xl font-bold border border-slate-700 transition">
        ⬅ Back to Store
      </a>
    </div>

    <div class="bg-slate-800/40 border border-slate-700/60 rounded-2xl p-6 mb-8 backdrop-blur-md">
      <h2 class="text-lg font-bold mb-4 flex items-center gap-2">
        <i class="fa-solid fa-plus text-indigo-400"></i> List New Equipment
      </h2>
      <form id="add-item-form" class="space-y-4">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <input type="text" id="title" placeholder="Equipment Name (e.g. Canon EOS R6)" class="bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm focus:outline-none focus:border-indigo-500" required>
          <input type="number" id="price" placeholder="Price per Day (LKR)" class="bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm focus:outline-none focus:border-indigo-500" required>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <select id="location" class="bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-slate-300" required>
            <option value="Colombo">Colombo</option>
            <option value="Kandy">Kandy</option>
            <option value="Gampaha">Gampaha</option>
            <option value="Galle">Galle</option>
            <option value="Kurunegala">Kurunegala</option>
          </select>
          <select id="category" class="bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-slate-300" required>
            <option value="Power Tools">Power Tools</option>
            <option value="Photography">Cameras & Gear</option>
            <option value="Gardening">Gardening Tools</option>
            <option value="Electronics">Electronics</option>
          </select>
        </div>
        <textarea id="description" placeholder="Description & rules..." class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm focus:outline-none focus:border-indigo-500 h-24"></textarea>
        <input type="url" id="imageUrl" placeholder="Direct Image URL" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm focus:outline-none focus:border-indigo-500" required>
        
        <button type="submit" class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white py-3 rounded-xl font-bold text-sm shadow-lg shadow-indigo-600/30 transition duration-300">
          🚀 Publish Equipment
        </button>
      </form>
    </div>

    <h2 class="text-xl font-bold mb-4">Your Active Listings</h2>
    <div id="my-items-list" class="space-y-4">
      <p class="text-slate-500 text-sm">Loading your items...</p>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, query, where, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA9UV8Td4R4ZFBZVrRzsIVaQ7j5Qd0-Fs8",
      authDomain: "rentify-lk.firebaseapp.com",
      databaseURL: "https://rentify-lk-default-rtdb.firebaseio.com",
      projectId: "rentify-lk",
      storageBucket: "rentify-lk.firebasestorage.app",
      messagingSenderId: "737637151231",
      appId: "1:737637151231:web:75286f9a9075f4511a77ca",
      measurementId: "G-GE52CR2RH6"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;

    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        loadMyItems(user.uid);
      } else {
        alert("Please login first!");
        window.location.href = "index.html";
      }
    });

    document.getElementById("add-item-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      await addDoc(collection(db, "items"), {
        title: document.getElementById("title").value,
        price: document.getElementById("price").value,
        location: document.getElementById("location").value,
        category: document.getElementById("category").value,
        description: document.getElementById("description").value,
        imageUrl: document.getElementById("imageUrl").value,
        status: "Available",
        ownerId: currentUser.uid,
        createdAt: new Date()
      });
      alert("Success! Item published.");
      document.getElementById("add-item-form").reset();
    });

    function loadMyItems(userId) {
      const q = query(collection(db, "items"), where("ownerId", "==", userId));
      onSnapshot(q, (snapshot) => {
        const list = document.getElementById("my-items-list");
        list.innerHTML = "";
        snapshot.forEach((itemDoc) => {
          const item = itemDoc.data();
          const docId = itemDoc.id;
          const isAvail = item.status === "Available";

          list.innerHTML += `
            <div class="bg-slate-800/40 border border-slate-700/60 p-4 rounded-xl flex items-center justify-between">
              <div class="flex items-center gap-4">
                <img src="${item.imageUrl}" class="w-16 h-16 rounded-lg object-cover bg-slate-900">
                <div>
                  <h4 class="font-bold text-white">${item.title}</h4>
                  <span class="text-xs text-slate-400">LKR ${item.price} / day | 📍 ${item.location}</span>
                  <div class="mt-1">
                    <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${isAvail ? 'bg-emerald-500/20 text-emerald-400' : 'bg-rose-500/20 text-rose-400'}">
                      ${item.status}
                    </span>
                  </div>
                </div>
              </div>
              <div class="flex gap-2">
                <button onclick="toggleStatus('${docId}', '${item.status}')" class="px-3 py-1.5 text-xs font-bold rounded-lg ${isAvail ? 'bg-amber-600 hover:bg-amber-500' : 'bg-emerald-600 hover:bg-emerald-500'} transition">
                  ${isAvail ? 'Mark Rented' : 'Mark Available'}
                </button>
                <button onclick="deleteItem('${docId}')" class="px-3 py-1.5 text-xs font-bold bg-rose-600/20 hover:bg-rose-600 text-rose-300 rounded-lg transition border border-rose-500/30">
                  <i class="fa-solid fa-trash"></i>
                </button>
              </div>
            </div>
          `;
        });
      });
    }

    window.toggleStatus = async (id, status) => {
      const newStatus = status === "Available" ? "Currently Rented" : "Available";
      await updateDoc(doc(db, "items", id), { status: newStatus });
    };

    window.deleteItem = async (id) => {
      if(confirm("Are you sure you want to delete this listing?")) {
        await deleteDoc(doc(db, "items", id));
      }
    };
  </script>
</body>
</html>
