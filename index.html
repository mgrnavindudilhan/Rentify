<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rentify LK - Next-Gen Equipment Sharing</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .glassmorphic {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white">

  <div class="fixed top-0 left-1/4 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"></div>
  <div class="fixed bottom-0 right-1/4 w-96 h-96 bg-purple-600/20 rounded-full blur-3xl pointer-events-none"></div>

  <nav class="sticky top-0 z-50 bg-slate-900/80 backdrop-blur-md border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center text-white font-black text-xl shadow-lg shadow-indigo-500/30">
          ⚡
        </div>
        <div>
          <span class="text-xl font-extrabold bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">Rentify</span>
          <span class="text-xs font-bold px-1.5 py-0.5 rounded bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 ml-1">LK</span>
        </div>
      </div>

      <div id="auth-section" class="flex items-center gap-3">
        <button id="login-btn" class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2.5 rounded-xl font-bold text-sm transition-all duration-300 shadow-lg shadow-indigo-600/25 flex items-center gap-2">
          <i class="fa-brands fa-google"></i> Sign In
        </button>
        <div id="user-info" class="hidden flex items-center gap-3 bg-slate-800/80 p-1.5 pr-4 rounded-full border border-slate-700">
          <img id="user-img" src="" class="w-8 h-8 rounded-full border-2 border-indigo-500">
          <span id="user-name" class="font-semibold text-sm text-slate-200"></span>
          <a href="owner.html" class="ml-2 text-xs bg-indigo-500/20 text-indigo-300 hover:bg-indigo-500/30 px-3 py-1.5 rounded-full border border-indigo-500/40 transition">Dashboard 👑</a>
        </div>
      </div>
    </div>
  </nav>

  <main class="flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full z-10">
    <div class="text-center max-w-3xl mx-auto mb-10">
      <span class="text-xs font-bold uppercase tracking-widest text-indigo-400 bg-indigo-500/10 px-3 py-1 rounded-full border border-indigo-500/20">Peer-to-Peer Rental Network</span>
      <h1 class="text-4xl sm:text-5xl font-black mt-3 mb-4 bg-gradient-to-r from-white via-slate-100 to-slate-400 bg-clip-text text-transparent leading-tight">Rent Anything, Anywhere in Sri Lanka</h1>
      <p class="text-slate-400 text-sm sm:text-base">Get access to high-end tools, cameras, and equipment near you without buying.</p>
    </div>

    <div class="bg-slate-800/50 border border-slate-700/60 rounded-2xl p-4 sm:p-6 mb-10 shadow-2xl backdrop-blur-xl">
      <div class="grid grid-cols-1 sm:grid-cols-12 gap-3">
        <div class="sm:col-span-6 relative">
          <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
          <input type="text" id="search-input" placeholder="Search equipment (e.g. Sony A7III, Lawn Mower)..." class="w-full bg-slate-900 border border-slate-700 rounded-xl pl-11 pr-4 py-3 text-sm focus:outline-none focus:border-indigo-500 transition">
        </div>
        <div class="sm:col-span-3">
          <select id="location-filter" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500 transition text-slate-300">
            <option value="All">📍 All Locations</option>
            <option value="Colombo">Colombo</option>
            <option value="Kandy">Kandy</option>
            <option value="Gampaha">Gampaha</option>
            <option value="Galle">Galle</option>
            <option value="Kurunegala">Kurunegala</option>
          </select>
        </div>
        <div class="sm:col-span-3">
          <select id="category-filter" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500 transition text-slate-300">
            <option value="All">⚡ All Categories</option>
            <option value="Power Tools">Power Tools</option>
            <option value="Photography">Cameras & Gear</option>
            <option value="Gardening">Gardening Tools</option>
            <option value="Electronics">Electronics</option>
          </select>
        </div>
      </div>
    </div>

    <div id="items-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <div class="bg-slate-800/40 rounded-2xl p-4 border border-slate-700/50 animate-pulse h-96"></div>
      <div class="bg-slate-800/40 rounded-2xl p-4 border border-slate-700/50 animate-pulse h-96"></div>
      <div class="bg-slate-800/40 rounded-2xl p-4 border border-slate-700/50 animate-pulse h-96"></div>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA9UV8Td4R4ZFBZVrRzsIVaQ7j5Qd0-Fs8",
      authDomain: "rentify-lk.firebaseapp.com",
      databaseURL: "https://rentify-lk-default-rtdb.firebaseio.com",
      projectId: "rentify-lk",
      storageBucket: "rentify-lk.firebasestorage.app",
      messagingSenderId: "737637151231",
      appId: "1:737637151231:web:75286f9a9075f4511a77ca",
      measurementId: "G-GE52CR2RH6"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    let allItems = [];

    // Google Login
    document.getElementById("login-btn").addEventListener("click", () => {
      signInWithPopup(auth, provider).catch(err => alert(err.message));
    });

    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById("login-btn").classList.add("hidden");
        document.getElementById("user-info").classList.remove("hidden");
        document.getElementById("user-img").src = user.photoURL;
        document.getElementById("user-name").innerText = user.displayName;
      }
    });

    // Real-time Fetch & Filter Logic
    const itemsContainer = document.getElementById("items-container");

    onSnapshot(collection(db, "items"), (snapshot) => {
      allItems = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      renderItems(allItems);
    });

    function renderItems(items) {
      itemsContainer.innerHTML = "";
      if(items.length === 0) {
        itemsContainer.innerHTML = `
          <div class="col-span-full text-center py-16 text-slate-500">
            <i class="fa-solid fa-box-open text-4xl mb-3"></i>
            <p>No equipment found matching your criteria.</p>
          </div>`;
        return;
      }

      items.forEach(item => {
        const isAvailable = item.status === "Available";
        itemsContainer.innerHTML += `
          <div class="group bg-slate-800/40 border border-slate-700/60 rounded-2xl overflow-hidden hover:border-indigo-500/50 hover:shadow-2xl hover:shadow-indigo-500/10 transition duration-300 flex flex-col">
            <div class="relative h-52 overflow-hidden bg-slate-900">
              <img src="${item.imageUrl || 'https://via.placeholder.com/400'}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
              <span class="absolute top-3 left-3 text-xs font-bold px-3 py-1 rounded-full backdrop-blur-md ${isAvailable ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-rose-500/20 text-rose-400 border border-rose-500/30'}">
                ● ${item.status}
              </span>
              <span class="absolute top-3 right-3 text-xs font-semibold px-2.5 py-1 rounded-full bg-slate-900/80 text-slate-300 border border-slate-700">
                📍 ${item.location}
              </span>
            </div>

            <div class="p-5 flex-1 flex flex-col justify-between">
              <div>
                <span class="text-[10px] font-bold tracking-wider uppercase text-indigo-400">${item.category || 'Tool'}</span>
                <h3 class="text-lg font-bold text-slate-100 group-hover:text-indigo-400 transition mb-2">${item.title}</h3>
                <p class="text-slate-400 text-xs line-clamp-2 mb-4">${item.description}</p>
              </div>

              <div class="pt-4 border-t border-slate-700/50 flex items-center justify-between">
                <div>
                  <span class="text-xs text-slate-500 block">Per Day</span>
                  <span class="text-lg font-extrabold text-white">LKR ${item.price}</span>
                </div>
                <a href="chat.html?ownerId=${item.ownerId}&itemId=${item.id}&itemTitle=${encodeURIComponent(item.title)}" 
                   class="px-4 py-2 text-xs font-bold rounded-xl transition duration-300 ${isAvailable ? 'bg-indigo-600 hover:bg-indigo-500 text-white shadow-lg shadow-indigo-600/20' : 'bg-slate-700 text-slate-500 pointer-events-none'}">
                  ${isAvailable ? 'Request Borrow ⚡' : 'Unavailable'}
                </a>
              </div>
            </div>
          </div>
        `;
      });
    }

    // Live Search & Category Filtering
    document.getElementById("search-input").addEventListener("input", filterData);
    document.getElementById("location-filter").addEventListener("change", filterData);
    document.getElementById("category-filter").addEventListener("change", filterData);

    function filterData() {
      const search = document.getElementById("search-input").value.toLowerCase();
      const location = document.getElementById("location-filter").value;
      const category = document.getElementById("category-filter").value;

      const filtered = allItems.filter(item => {
        const matchesSearch = item.title.toLowerCase().includes(search) || item.description.toLowerCase().includes(search);
        const matchesLoc = location === "All" || item.location === location;
        const matchesCat = category === "All" || item.category === category;
        return matchesSearch && matchesLoc && matchesCat;
      });

      renderItems(filtered);
    }
  </script>
</body>
</html>
