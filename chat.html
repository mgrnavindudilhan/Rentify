<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rentify LK - Secure Chat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-900 text-slate-100 h-screen flex flex-col max-w-lg mx-auto border-x border-slate-800">

  <div class="p-4 bg-slate-800/80 border-b border-slate-700 flex items-center gap-3 backdrop-blur-md">
    <a href="index.html" class="text-slate-400 hover:text-white"><i class="fa-solid fa-arrow-left"></i></a>
    <div>
      <h2 id="chat-title" class="font-bold text-sm text-white">Inquiry Chat</h2>
      <span class="text-[10px] text-emerald-400 flex items-center gap-1">● End-to-End Realtime</span>
    </div>
  </div>

  <div id="messages-box" class="flex-1 p-4 overflow-y-auto space-y-3 bg-slate-950/50">
    <p class="text-slate-600 text-center text-xs">Loading encrypted messages...</p>
  </div>

  <form id="chat-form" class="p-3 bg-slate-800 border-t border-slate-700 flex gap-2">
    <input type="text" id="msg-input" placeholder="Type message to owner..." class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500" required>
    <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2.5 rounded-xl font-bold text-sm shadow-lg shadow-indigo-600/30">
      <i class="fa-solid fa-paper-plane"></i>
    </button>
  </form>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA9UV8Td4R4ZFBZVrRzsIVaQ7j5Qd0-Fs8",
      authDomain: "rentify-lk.firebaseapp.com",
      databaseURL: "https://rentify-lk-default-rtdb.firebaseio.com",
      projectId: "rentify-lk",
      storageBucket: "rentify-lk.firebasestorage.app",
      messagingSenderId: "737637151231",
      appId: "1:737637151231:web:75286f9a9075f4511a77ca",
      measurementId: "G-GE52CR2RH6"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const urlParams = new URLSearchParams(window.location.search);
    const itemId = urlParams.get('itemId');
    const itemTitle = urlParams.get('itemTitle');

    document.getElementById("chat-title").innerText = decodeURIComponent(itemTitle || 'Equipment Chat');

    let currentUser = null;

    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        loadMessages();
      } else {
        alert("Please login first!");
        window.location.href = "index.html";
      }
    });

    document.getElementById("chat-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = document.getElementById("msg-input").value;
      if(!text || !currentUser) return;

      await addDoc(collection(db, `chats_${itemId}`), {
        senderId: currentUser.uid,
        senderName: currentUser.displayName,
        text: text,
        timestamp: new Date()
      });

      document.getElementById("msg-input").value = "";
    });

    function loadMessages() {
      const q = query(collection(db, `chats_${itemId}`), orderBy("timestamp", "asc"));
      onSnapshot(q, (snapshot) => {
        const box = document.getElementById("messages-box");
        box.innerHTML = "";
        snapshot.forEach((doc) => {
          const msg = doc.data();
          const isMe = msg.senderId === currentUser.uid;
          box.innerHTML += `
            <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'}">
              <span class="text-[10px] text-slate-500 mb-1 px-1">${msg.senderName}</span>
              <div class="px-4 py-2.5 rounded-2xl text-xs max-w-[85%] ${isMe ? 'bg-indigo-600 text-white rounded-br-none' : 'bg-slate-800 text-slate-200 border border-slate-700 rounded-bl-none'}">
                ${msg.text}
              </div>
            </div>
          `;
        });
        box.scrollTop = box.scrollHeight;
      });
    }
  </script>
</body>
</html>
